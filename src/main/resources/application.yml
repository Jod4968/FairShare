spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fairshare}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${PORT:8080}
app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-at-least-32-characters}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
ai:
  enabled: ${AI_ENABLED:false}
  provider: ${AI_PROVIDER:ollama}
  base-url: ${AI_BASE_URL:http://localhost:11434}
  model: ${AI_MODEL:gemma3:4b}
  timeout-ms: ${AI_TIMEOUT_MS:10000}
